# Omakase Ruby styling for Rails
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

# House Style: Code Length and Complexity Metrics
Metrics/MethodLength:
  Enabled: true
  Max: 25
  CountComments: false
  Exclude:
    - "db/migrate/*"
    - "db/schema.rb"
    - "db/seeds.rb"
    - "test/**/*"

Metrics/AbcSize:
  Enabled: true
  Max: 30
  Exclude:
    - "db/migrate/*"
    - "db/seeds.rb"
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 10
  Exclude:
    - "db/migrate/*"
    - "db/seeds.rb"
    - "test/**/*"

Metrics/PerceivedComplexity:
  Enabled: true
  Max: 10
  Exclude:
    - "db/migrate/*"
    - "db/seeds.rb"
    - "test/**/*"

Metrics/ClassLength:
  Enabled: true
  Max: 250
  Exclude:
    - "db/migrate/*"
    - "db/seeds.rb"
    - "test/**/*"

Metrics/BlockLength:
  Enabled: true
  Max: 40
  Exclude:
    - "config/routes.rb"
    - "config/environments/*"
    - "db/schema.rb"
    - "db/seeds.rb"
    - "test/**/*"
